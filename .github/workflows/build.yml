name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake --preset default
          cmake --build --preset release

      - name: Package
        shell: pwsh
        run: |
          $bin = "build/bin/Release"
          Compress-Archive -DestinationPath instant-alt-tab.zip -Path `
            "$bin/instant-alt-tab.exe", "$bin/instant-alt-tab-agent.exe", "$bin/instant-alt-tab-hook.dll", README.md, LICENSE

      - uses: actions/upload-artifact@v7
        with:
          path: instant-alt-tab.zip
          archive: false  # the zip itself, not a zip inside a zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: instant-alt-tab.zip
