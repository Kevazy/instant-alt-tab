name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # to attach the executable to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake --preset default
          cmake --build --preset release

      # The agent and the hook DLL are built into instant-alt-tab.exe, so it is all users download.
      - uses: actions/upload-artifact@v7
        with:
          path: build/bin/Release/instant-alt-tab.exe
          archive: false

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(\S+ VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "The tag ${{ github.ref_name }} doesn't match version $version in CMakeLists.txt"
          }

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/bin/Release/instant-alt-tab.exe
            THIRD-PARTY-NOTICES.txt
